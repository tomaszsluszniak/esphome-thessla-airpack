name: Release

# Push a tag like v1.0.0; manifests can then pin github://tomaszsluszniak/esphome-thessla-airpack@v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

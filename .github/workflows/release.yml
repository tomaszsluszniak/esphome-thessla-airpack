name: Release

# Push a tag like v1.0.0; manifests can then pin github://tomaszsluszniak/esphome-thessla-airpack@v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {found=1; next} found && /^(## \[|\[[^]]+\]: )/ {exit} found' \
            CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
